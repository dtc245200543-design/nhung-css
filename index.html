<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nhúng CSS vào HTML</title>

    <!-- Phần 2: Internal CSS -->
    <style>
        .internal {
            color: blue;
        }
    </style>

    <!-- Phần 3: External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Phần 1: Inline CSS -->
    <h1 style="color: red;">Inline CSS</h1>
    <p style="color: red;">Đây là đoạn văn sử dụng Inline CSS.</p>

    <!-- Phần 2: Internal CSS -->
    <h1 class="internal">Internal CSS</h1>
    <p class="internal">Đây là đoạn văn sử dụng Internal CSS.</p>

    <!-- Phần 3: External CSS -->
    <h1 class="external">External CSS</h1>
    <p class="external">Đây là đoạn văn sử dụng External CSS.</p>

</body>
</html>
